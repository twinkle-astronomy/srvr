# PR flow: run the full test suite on every push to a PR, then publish a
# multi-arch image tagged with the PR's branch name. When the PR closes
# (merged or abandoned) the branch tag is deleted from ghcr — durable images
# come from the v* release flow (docker-publish.yml).
name: PR

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Full suite inside the same compose services developers use: the srvr dev
  # container (cargo + dx + wasm target) with the chrome service providing
  # WEBDRIVER_URL for the mandatory browser E2E tier.
  test:
    if: github.event.action != 'closed'
    runs-on: arc-runner-amd64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install docker compose plugin
        # The ARC runner image ships the docker CLI without the compose plugin.
        run: |
          mkdir -p ~/.docker/cli-plugins
          curl -fsSL "https://github.com/docker/compose/releases/download/v5.3.0/docker-compose-linux-$(uname -m)" \
            -o ~/.docker/cli-plugins/docker-compose
          chmod +x ~/.docker/cli-plugins/docker-compose
          docker compose version

      - name: Build compose images
        # UID is bash-readonly (already correct); GID must be derived. Compose
        # passes both as build args so the container user owns the workspace.
        run: |
          export UID
          export GID="$(id -g)"
          docker compose build srvr chrome

      - name: Start chrome (WebDriver) service
        run: docker compose up -d chrome

      - name: Run tests
        # `compose run` overrides the srvr service's `sleep infinity` command
        # and does not publish its ports, so nothing collides on a shared runner.
        run: |
          export UID
          export GID="$(id -g)"
          docker compose run --rm srvr bash -lc '
            set -e
            dx build --platform web
            cargo test --features server
            cargo check --no-default-features --features web --target wasm32-unknown-unknown'

      - name: Tear down compose services
        if: always()
        run: docker compose down --remove-orphans

  image:
    if: github.event.action != 'closed'
    needs: test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      # metadata-action sanitizes the branch name into a valid tag
      # (lowercased, invalid chars -> '-'); cleanup below mirrors that.
      tags: type=raw,value=${{ github.head_ref }}

  cleanup:
    if: github.event.action == 'closed'
    runs-on: arc-runner-amd64
    permissions:
      packages: write
    steps:
      - name: Compute image tag for branch
        id: tag
        # Mirror docker/metadata-action's sanitization of the raw branch name.
        run: |
          tag="${GITHUB_HEAD_REF,,}"
          tag="$(echo "$tag" | sed 's/[^a-z0-9._-]/-/g')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Delete branch image tag from ghcr
        uses: dataaxiom/ghcr-cleanup-action@v1.2.2
        # Deletes the manifest list and its orphaned per-arch children while
        # keeping digests referenced by other tags (release images).
        # Tolerate a missing tag: PRs whose tests never passed push no image.
        continue-on-error: true
        with:
          delete-tags: ${{ steps.tag.outputs.tag }}
          token: ${{ secrets.GITHUB_TOKEN }}
