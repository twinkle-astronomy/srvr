# Release images: on version tags (and manual dispatch), build the multi-arch
# image and push it tagged with the semver (and branch name on dispatch).
# The build itself lives in the reusable build-image.yml workflow, shared with
# the PR flow (pr.yml).
name: Build and publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      tags: |
        type=ref,event=branch
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
